name: reviso

services:
  reviso:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BITGET_QWEN_API_KEY: "${BITGET_QWEN_API_KEY}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      REVISO_LLM_MODEL: "${REVISO_LLM_MODEL:-qwen/qwen3.8-27b}"
      REVISO_DRAFT_MODEL: "${REVISO_DRAFT_MODEL:-openai/gpt-oss-20b}"
      REVISO_DB_PATH: /app/data/reviso.sqlite3
      REVISO_SERVE_WEB: "1"
      REVISO_WEB_DIST: /app/apps/web/dist
      REVISO_PUBLIC_DEMO: "1"
      REVISO_ALLOWED_HOSTS: "${REVISO_HOST}"
      REVISO_ALLOWED_ORIGINS: "https://${REVISO_HOST}"
      REVISO_GOOGLE_CLIENT_ID: "${REVISO_GOOGLE_CLIENT_ID}"
      REVISO_QWEN_USER_DAILY_LIMIT: "${REVISO_QWEN_USER_DAILY_LIMIT:-20}"
      REVISO_QWEN_TOTAL_DAILY_LIMIT: "${REVISO_QWEN_TOTAL_DAILY_LIMIT:-200}"
      REVISO_QWEN_MAX_CONCURRENT_USER: "${REVISO_QWEN_MAX_CONCURRENT_USER:-1}"
      REVISO_QWEN_MAX_CONCURRENT_TOTAL: "${REVISO_QWEN_MAX_CONCURRENT_TOTAL:-4}"
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - reviso-data:/app/data

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      - reviso
    environment:
      REVISO_HOST: "${REVISO_HOST}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  reviso-data:
  caddy-data:
  caddy-config:
