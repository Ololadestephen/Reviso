services:
  reviso:
    build:
      context: .
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      BITGET_QWEN_API_KEY: "${BITGET_QWEN_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      REVISO_LLM_MODEL: "${REVISO_LLM_MODEL:-qwen/qwen3.8-27b}"
      REVISO_DRAFT_MODEL: "${REVISO_DRAFT_MODEL:-openai/gpt-oss-20b}"
      REVISO_DB_PATH: /app/data/reviso.sqlite3
      REVISO_SERVE_WEB: "1"
      REVISO_WEB_DIST: /app/apps/web/dist
      REVISO_PUBLIC_DEMO: "${REVISO_PUBLIC_DEMO:-0}"
      REVISO_ALLOWED_HOSTS: "${REVISO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      REVISO_ALLOWED_ORIGINS: "${REVISO_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}"
      REVISO_GOOGLE_CLIENT_ID: "${REVISO_GOOGLE_CLIENT_ID:-}"
      REVISO_AUTH_MODE: "${REVISO_AUTH_MODE:-}"
      REVISO_QWEN_USER_DAILY_LIMIT: "${REVISO_QWEN_USER_DAILY_LIMIT:-}"
      REVISO_QWEN_TOTAL_DAILY_LIMIT: "${REVISO_QWEN_TOTAL_DAILY_LIMIT:-}"
      REVISO_QWEN_MAX_CONCURRENT_USER: "${REVISO_QWEN_MAX_CONCURRENT_USER:-}"
      REVISO_QWEN_MAX_CONCURRENT_TOTAL: "${REVISO_QWEN_MAX_CONCURRENT_TOTAL:-}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - reviso-data:/app/data

volumes:
  reviso-data:
